# Fonts
font_family      family="Maple Mono NF"
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 17

font_features MapleMono-NF-Regular +ss01 +ss06
font_features MapleMono-NF-Bold +ss01 +ss06
font_features MapleMono-NF-BoldItalic +ss01 +ss06
font_features MapleMono-NF-Italic +ss01 +ss06

modify_font cell_height 110%
modify_font cell_width -1px

# first number = thickness dark on light (default 1.7)
# second number = contrast, impact on dark themes (default 30)
text_composition_strategy 1.8 30

# Cursor
# cursor_trail 3
# cursor_trail_decay 0.1 0.2

# Symbols
# Material Design Icons
# symbol_map U+f0001-U+f1af0 Symbols Nerd Font Mono

# Mouse
mouse_hide_wait 1.0
mouse_map left click ungrabbed no_op

# Window
window_padding_width 1
hide_window_decorations titlebar-only

# Background
# ctrl+shift+a>m and ctrl+shift+a>l
dynamic_background_opacity yes
background_opacity 0.75
background_blur 10 

# Keybinds
macos_option_as_alt yes

# shift-enter claude
map shift+enter send_text all \x1b\r

# font resizing by 1
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+underscore change_font_size all -1.0

# splits
enabled_layouts splits,stack

# remote controle
allow_remote_control yes
listen_on unix:/tmp/mykitty

# Tmux like mappings
map ctrl+a>bar launch --cwd=current --location=vsplit
map ctrl+a>minus launch --cwd=current --location=hsplit
map ctrl+a>x close_window
map ctrl+a>slash search_scrollback
map ctrl+a>m toggle_layout stack
map ctrl+a>r load_config_file

map ctrl+a>f launch --type=overlay ~/bin/scripts/kitty-sessionizer
map ctrl+a>shift+d launch --type=overlay ~/bin/scripts/kitty-sessionizer ~/dotfiles
map ctrl+a>c new_tab_with_cwd
map ctrl+a>n next_tab
map ctrl+a>p previous_tab
map ctrl+a>1 goto_tab 1
map ctrl+a>2 goto_tab 2
map ctrl+a>3 goto_tab 3
map ctrl+a>4 goto_tab 4
map ctrl+a>5 goto_tab 5
map ctrl+a>6 goto_tab 6
map ctrl+a>7 goto_tab 7
map ctrl+a>8 goto_tab 8
map ctrl+a>9 goto_tab 9
map ctrl+a>comma set_tab_title
map ctrl+a>& close_tab

# smart-splits.nvim: nvim sets the IS_NVIM user var, the bare maps pass the keys through to nvim
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+h neighboring_window left
map ctrl+l neighboring_window right

map --when-focus-on var:IS_NVIM ctrl+j
map --when-focus-on var:IS_NVIM ctrl+k
map --when-focus-on var:IS_NVIM ctrl+h
map --when-focus-on var:IS_NVIM ctrl+l

map alt+j kitten relative_resize.py down  3
map alt+k kitten relative_resize.py up    3
map alt+h kitten relative_resize.py left  3
map alt+l kitten relative_resize.py right 3

map --when-focus-on var:IS_NVIM alt+j
map --when-focus-on var:IS_NVIM alt+k
map --when-focus-on var:IS_NVIM alt+h
map --when-focus-on var:IS_NVIM alt+l

# lazygit
map ctrl+a>g launch --type=overlay --cwd=current /opt/homebrew/bin/lazygit

# BEGIN_THEME
include github-plus-dark.conf
# END_THEME

# Tabs, styled after the tmux status bar (after the theme include so these win)
tab_bar_edge top
tab_bar_min_tabs 1
tab_bar_style powerline
tab_powerline_style round
bell_on_tab "● "
tab_title_template "{fmt.fg._f2cc60}{bell_symbol}{fmt.fg.tab}{index} {title}"
active_tab_title_template "{index} {title}"
active_tab_font_style bold
inactive_tab_font_style normal
