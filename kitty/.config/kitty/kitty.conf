# Fonts
font_family      family="Maple Mono NF"
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 17

font_features MapleMono-NF-Regular +ss01 +ss06
font_features MapleMono-NF-Bold +ss01 +ss06
font_features MapleMono-NF-BoldItalic +ss01 +ss06
font_features MapleMono-NF-Italic +ss01 +ss06

modify_font cell_height 110%
modify_font cell_width -1px

# first number = thickness dark on light (default 1.7)
# second number = contrast, impact on dark themes (default 30)
text_composition_strategy 1.8 30

# Cursor
# cursor_trail 3
# cursor_trail_decay 0.1 0.2

# Symbols
# Material Design Icons
# symbol_map U+f0001-U+f1af0 Symbols Nerd Font Mono

# Mouse
mouse_hide_wait 1.0
mouse_map left click ungrabbed no_op

# Window
window_padding_width 1
hide_window_decorations titlebar-only

# Background
# ctrl+shift+a>m and ctrl+shift+a>l
dynamic_background_opacity yes
background_opacity 0.75
background_blur 10 

# Keybinds
macos_option_as_alt yes

# shift-enter claude
map shift+enter send_text all \x1b\r

# font resizing by 1
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+underscore change_font_size all -1.0

# splits
enabled_layouts splits
# Create horizontal split (side-by-side or top-bottom depending on axis)
map f5 launch --cwd=current --location=hsplit
# Create vertical split
map f6 launch --cwd=current --location=vsplit


# BEGIN_THEME
include github-plus-dark.conf
# END_THEME
